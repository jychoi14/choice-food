<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | What Should I Eat Today?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <meta name="google-adsense-account" content="ca-pub-3060510773916611">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3060510773916611" crossorigin="anonymous"></script>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
            const savedLang = localStorage.getItem('lang') || (navigator.language.startsWith('ko') ? 'ko' : 'en');
            document.documentElement.setAttribute('data-lang', savedLang);
        })();
    </script>
    <style>
        :root {
            --bg-color: #fffaf5;
            --card-bg: #ffffff;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --primary-color: #ff6b6b;
            --primary-hover: #ee5253;
            --accent-color: #ff9f43;
            --border-color: #ffeaa7;
            --selector-bg: #fff5e6;
            --select-btn-bg: #ffffff;
            --slot-bg: #2d3436;
            --slot-text: #fab1a0;
        }

        html[data-theme="dark"] {
            --bg-color: #1e272e;
            --card-bg: #2f3640;
            --text-primary: #f5f6fa;
            --text-secondary: #dcdde1;
            --border-color: #576574;
            --selector-bg: #1e272e;
            --select-btn-bg: #2f3640;
            --slot-bg: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.1);
            padding: 40px 24px;
            text-align: center;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .top-controls {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-control:hover {
            background-color: var(--selector-bg);
            transform: scale(1.1);
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        /* 이미지 컨테이너 */
        .image-container {
            width: 100%;
            height: 220px;
            border-radius: 20px;
            margin-bottom: 20px;
            overflow: hidden;
            background: var(--selector-bg);
            border: 2px solid var(--border-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        #foodImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 0;
            transform: scale(1.1);
        }

        #foodImage.show {
            opacity: 1;
            transform: scale(1);
        }

        .image-placeholder {
            position: absolute;
            font-size: 60px;
            opacity: 0.2;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.1); opacity: 0.3; }
            100% { transform: scale(1); opacity: 0.2; }
        }

        /* 슬롯머신 스타일 */
        .slot-machine {
            background: var(--slot-bg);
            height: 80px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            border: 3px solid var(--accent-color);
        }

        .slot-content {
            font-size: 28px;
            font-weight: 900;
            color: var(--slot-text);
            text-shadow: 0 0 10px rgba(250, 177, 160, 0.5);
            transition: transform 0.1s ease-in-out;
        }

        /* 카테고리 선택 */
        .category-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .btn-category {
            background: var(--select-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-category:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-category.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        /* 메인 버튼 */
        .btn-recommend {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: #ffffff;
            border: none;
            padding: 18px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .btn-recommend:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 107, 107, 0.4);
        }

        .btn-recommend:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
        }

        /* 기록 영역 */
        .history-section {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px dashed var(--border-color);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .history-title {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-primary);
        }

        .btn-clear {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-item {
            display: flex;
            align-items: center;
            background: var(--selector-bg);
            padding: 10px 15px;
            border-radius: 15px;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .history-img {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .history-info {
            flex: 1;
            text-align: left;
        }

        .history-menu { font-weight: 700; color: var(--primary-color); display: block; }
        .history-tag {
            font-size: 10px;
            background: var(--accent-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
        }
        .history-time { font-size: 11px; color: var(--text-secondary); }
        .no-history { color: var(--text-secondary); font-size: 14px; padding: 20px; }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 26px; }
            .slot-content { font-size: 24px; }
            .image-container { height: 180px; }
        }

        /* 푸터 제휴 문의 링크 */
        .footer-links {
            margin-top: 20px;
            text-align: center;
        }

        .link-contact {
            color: var(--text-secondary);
            text-decoration: underline;
            background: none;
            border: none;
            font-family: inherit;
            cursor: pointer;
            font-size: 13px;
            transition: color 0.2s;
        }

        .link-contact:hover {
            color: var(--primary-color);
        }

        /* 제휴 문의 모달 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeInModal 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            padding: 30px 24px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: left;
            animation: slideUpModal 0.3s ease;
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUpModal {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
            line-height: 1;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--selector-bg);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary-color);
        }

        textarea.form-control {
            resize: none;
            height: 100px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.2);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.3);
        }

        .btn-submit:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-controls">
            <button id="langToggle" class="btn-control" onclick="toggleLang()" aria-label="Language Toggle">🌐</button>
            <button id="themeToggle" class="btn-control" onclick="toggleTheme()" aria-label="Theme Toggle">🌙</button>
        </div>
        <h1 id="title">오늘 뭐 먹지?</h1>
        <p class="subtitle" id="subtitle">결정 장애 탈출! 오늘 당신의 운명 메뉴는?</p>

        <div class="image-container">
            <div class="image-placeholder">🍱</div>
            <img id="foodImage" src="" alt="Food Image">
        </div>

        <div class="category-container" id="categoryContainer">
            <!-- Categories injected here -->
        </div>

        <div class="slot-machine">
            <div class="slot-content" id="slotContent">Ready?</div>
        </div>

        <button class="btn-recommend" id="btnRecommend" onclick="startRecommendation()">추천해줘!</button>

        <div class="history-section">
            <div class="history-header">
                <span class="history-title" id="historyTitle">최근 먹은 기록</span>
                <button class="btn-clear" id="btnClear" onclick="clearHistory()">지우기</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="no-history" id="noHistory">아직 기록이 없어요.</div>
            </div>
        </div>
    </div>

    <div class="footer-links">
        <button id="btnContact" class="link-contact" onclick="openContactModal()">제휴 문의</button>
    </div>

    <!-- 제휴 문의 모달 -->
    <div id="contactModal" class="modal" onclick="handleModalClick(event)">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">제휴 및 문의</span>
                <button class="btn-close" onclick="closeContactModal()">&times;</button>
            </div>
            <form id="contactForm" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label id="labelCompany" for="company">회사명 / 이름</label>
                    <input type="text" id="company" name="company" class="form-control" required>
                </div>
                <div class="form-group">
                    <label id="labelEmail" for="email">이메일 주소</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label id="labelPhone" for="phone">연락처 (선택)</label>
                    <input type="tel" id="phone" name="phone" class="form-control">
                </div>
                <div class="form-group">
                    <label id="labelMessage" for="message">문의 내용</label>
                    <textarea id="message" name="message" class="form-control" required></textarea>
                </div>
                <button type="submit" id="btnSubmit" class="btn-submit">보내기</button>
            </form>
        </div>
    </div>

    <script>
        const i18n = {
            ko: {
                title: "오늘 뭐 먹지?",
                subtitle: "결정 장애 탈출! 오늘 당신의 운명 메뉴는?",
                recommend: "추천해줘!",
                historyTitle: "최근 먹은 기록",
                clear: "지우기",
                noHistory: "아직 기록이 없어요.",
                ready: "준비됐나요?",
                categories: {
                    all: "전체", korean: "한식", japanese: "일식", chinese: "중식", western: "양식", snack: "분식", dessert: "디저트"
                },
                contactLink: "제휴 문의",
                contactTitle: "제휴 및 문의",
                labelCompany: "회사명 / 이름",
                placeholderCompany: "회사명 또는 이름을 입력해주세요",
                labelEmail: "이메일 주소",
                placeholderEmail: "example@email.com",
                labelPhone: "연락처 (선택)",
                placeholderPhone: "연락처를 입력해주세요",
                labelMessage: "문의 내용",
                placeholderMessage: "문의 내용을 입력해주세요",
                btnSend: "보내기",
                sending: "전송 중...",
                sendSuccess: "문의가 성공적으로 전송되었습니다. 감사합니다!",
                sendError: "전송에 실패했습니다. 다시 시도해주세요."
            },
            en: {
                title: "What to Eat?",
                subtitle: "No more worries! What's your destiny meal today?",
                recommend: "Recommend Me!",
                historyTitle: "Recent History",
                clear: "Clear",
                noHistory: "No history yet.",
                ready: "Ready?",
                categories: {
                    all: "All", korean: "Korean", japanese: "Japanese", chinese: "Chinese", western: "Western", snack: "Snack", dessert: "Dessert"
                },
                contactLink: "Partnership / Contact Us",
                contactTitle: "Partnership & Inquiry",
                labelCompany: "Company / Name",
                placeholderCompany: "Enter company name or your name",
                labelEmail: "Email Address",
                placeholderEmail: "example@email.com",
                labelPhone: "Contact Number (Optional)",
                placeholderPhone: "Phone number",
                labelMessage: "Inquiry Content",
                placeholderMessage: "Enter your inquiry content",
                btnSend: "Submit",
                sending: "Sending...",
                sendSuccess: "Your inquiry has been sent successfully. Thank you!",
                sendError: "Failed to send. Please try again."
            }
        };

        const menuData = [
            { nameEn: "Kimchi Stew", nameKo: "김치찌개", category: "korean", keyword: "kimchi,stew" },
            { nameEn: "Bibimbap", nameKo: "비빔밥", category: "korean", keyword: "bibimbap" },
            { nameEn: "Bulgogi", nameKo: "불고기", category: "korean", keyword: "bulgogi" },
            { nameEn: "Sushi", nameKo: "초밥", category: "japanese", keyword: "sushi" },
            { nameEn: "Ramen", nameKo: "라멘", category: "japanese", keyword: "ramen" },
            { nameEn: "Tonkatsu", nameKo: "돈가스", category: "japanese", keyword: "cutlet" },
            { nameEn: "Tteokbokki", nameKo: "떡볶이", category: "snack", keyword: "tteokbokki" },
            { nameEn: "Jajangmyeon", nameKo: "짜장면", category: "chinese", keyword: "black-bean-noodles" },
            { nameEn: "Pasta", nameKo: "파스타", category: "western", keyword: "pasta" },
            { nameEn: "Pizza", nameKo: "피자", category: "western", keyword: "pizza" },
            { nameEn: "Burger", nameKo: "햄버거", category: "western", keyword: "burger" },
            { nameEn: "Steak", nameKo: "스테이크", category: "western", keyword: "steak" },
            { nameEn: "Waffle", nameKo: "와플", category: "dessert", keyword: "waffle" },
            { nameEn: "Cake", nameKo: "조각케이크", category: "dessert", keyword: "cake" }
        ];

        let currentLang = localStorage.getItem('lang') || (navigator.language.startsWith('ko') ? 'ko' : 'en');
        let currentCategory = "all";
        const HISTORY_KEY = 'food_history_v4';

        const updateUI = () => {
            const text = i18n[currentLang];
            document.getElementById('title').innerText = text.title;
            document.getElementById('subtitle').innerText = text.subtitle;
            document.getElementById('btnRecommend').innerText = text.recommend;
            document.getElementById('historyTitle').innerText = text.historyTitle;
            document.getElementById('btnClear').innerText = text.clear;
            document.getElementById('slotContent').innerText = text.ready;
            
            // Translate contact-related elements
            document.getElementById('btnContact').innerText = text.contactLink;
            document.getElementById('modalTitle').innerText = text.contactTitle;
            document.getElementById('labelCompany').innerText = text.labelCompany;
            document.getElementById('company').placeholder = text.placeholderCompany;
            document.getElementById('labelEmail').innerText = text.labelEmail;
            document.getElementById('email').placeholder = text.placeholderEmail;
            document.getElementById('labelPhone').innerText = text.labelPhone;
            document.getElementById('phone').placeholder = text.placeholderPhone;
            document.getElementById('labelMessage').innerText = text.labelMessage;
            document.getElementById('message').placeholder = text.placeholderMessage;
            document.getElementById('btnSubmit').innerText = text.btnSend;

            const catContainer = document.getElementById('categoryContainer');
            catContainer.innerHTML = '';
            Object.keys(text.categories).forEach(key => {
                const btn = document.createElement('button');
                btn.className = `btn-category ${currentCategory === key ? 'active' : ''}`;
                btn.innerText = text.categories[key];
                btn.onclick = () => {
                    currentCategory = key;
                    updateUI();
                };
                catContainer.appendChild(btn);
            });
            loadHistory();
        };

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'tick') {
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    gain.gain.setValueAtTime(0.05, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start(); osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'win') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        };

        const loadHistory = () => {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            if (history.length === 0) {
                list.innerHTML = `<div class="no-history">${i18n[currentLang].noHistory}</div>`;
                return;
            }
            list.innerHTML = history.map(item => `
                <div class="history-item">
                    <img src="${item.imgUrl}" class="history-img" alt="food">
                    <div class="history-info">
                        <span class="history-menu">${currentLang === 'ko' ? item.nameKo : item.nameEn}</span>
                        <span class="history-tag">${i18n[currentLang].categories[item.category]}</span>
                        <span class="history-time">${item.time}</span>
                    </div>
                </div>
            `).join('');
        };

        const saveHistory = (menu, imgUrl) => {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            const now = new Date();
            const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            history.unshift({ ...menu, time, imgUrl });
            if (history.length > 10) history.pop();
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            loadHistory();
        };

        const clearHistory = () => {
            localStorage.removeItem(HISTORY_KEY);
            loadHistory();
        };

        const startRecommendation = () => {
            const btn = document.getElementById('btnRecommend');
            const slot = document.getElementById('slotContent');
            const img = document.getElementById('foodImage');
            const filtered = currentCategory === "all" ? menuData : menuData.filter(m => m.category === currentCategory);
            
            btn.disabled = true;
            img.classList.remove('show');
            
            let count = 0;
            const maxTicks = 12;
            const interval = setInterval(() => {
                const randomMenu = filtered[Math.floor(Math.random() * filtered.length)];
                slot.innerText = currentLang === 'ko' ? randomMenu.nameKo : randomMenu.nameEn;
                playSound('tick');
                count++;
                if (count >= maxTicks) {
                    clearInterval(interval);
                    const finalMenu = filtered[Math.floor(Math.random() * filtered.length)];
                    slot.innerText = currentLang === 'ko' ? finalMenu.nameKo : finalMenu.nameEn;
                    slot.style.transform = 'scale(1.2)';
                    
                    const imgUrl = `https://loremflickr.com/400/300/food,${finalMenu.keyword}`;
                    img.src = imgUrl;
                    img.onload = () => img.classList.add('show');
                    
                    setTimeout(() => slot.style.transform = 'scale(1)', 200);
                    playSound('win');
                    saveHistory(finalMenu, imgUrl);
                    btn.disabled = false;
                }
            }, 150);
        };

        const toggleLang = () => {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            localStorage.setItem('lang', currentLang);
            document.documentElement.setAttribute('data-lang', currentLang);
            updateUI();
        };

        const toggleTheme = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            document.getElementById('themeToggle').innerText = target === 'dark' ? '☀️' : '🌙';
        };

        const openContactModal = () => {
            const modal = document.getElementById('contactModal');
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        };

        const closeContactModal = () => {
            const modal = document.getElementById('contactModal');
            modal.classList.remove('show');
            document.body.style.overflow = '';
            document.getElementById('contactForm').reset();
        };

        const handleModalClick = (e) => {
            if (e.target.id === 'contactModal') {
                closeContactModal();
            }
        };

        const submitForm = async (e) => {
            e.preventDefault();
            const form = e.target;
            const btn = document.getElementById('btnSubmit');
            const text = i18n[currentLang];

            btn.disabled = true;
            btn.innerText = text.sending;

            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => { data[key] = value; });

            try {
                const response = await fetch("https://formspree.io/f/xoeawaql", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert(text.sendSuccess);
                    closeContactModal();
                } else {
                    const errData = await response.json();
                    alert(errData.error || text.sendError);
                }
            } catch (err) {
                alert(text.sendError);
            } finally {
                btn.disabled = false;
                btn.innerText = text.btnSend;
            }
        };

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
            updateUI();
        };
    </script>
</body>
</html>
