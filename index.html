<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | 최고의 메뉴 추천 서비스</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        :root {
            --bg-color: #fffaf5;
            --card-bg: #ffffff;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --primary-color: #ff6b6b;
            --primary-hover: #ee5253;
            --accent-color: #ff9f43;
            --border-color: #ffeaa7;
            --selector-bg: #fff5e6;
            --select-btn-bg: #ffffff;
            --slot-bg: #2d3436;
            --slot-text: #fab1a0;
        }

        html[data-theme="dark"] {
            --bg-color: #1e272e;
            --card-bg: #2f3640;
            --text-primary: #f5f6fa;
            --text-secondary: #dcdde1;
            --border-color: #576574;
            --selector-bg: #1e272e;
            --select-btn-bg: #2f3640;
            --slot-bg: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.1);
            padding: 40px 24px;
            text-align: center;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .btn-theme-toggle {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .btn-theme-toggle:hover {
            background-color: var(--selector-bg);
            transform: scale(1.1);
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        /* 슬롯머신 스타일 */
        .slot-machine {
            background: var(--slot-bg);
            height: 120px;
            border-radius: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            border: 4px solid var(--accent-color);
        }

        .slot-content {
            font-size: 36px;
            font-weight: 900;
            color: var(--slot-text);
            text-shadow: 0 0 10px rgba(250, 177, 160, 0.5);
            transition: transform 0.1s ease-in-out;
        }

        .slot-label {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* 카테고리 선택 */
        .category-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .btn-category {
            background: var(--select-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-category:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-category.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        /* 메인 버튼 */
        .btn-recommend {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: #ffffff;
            border: none;
            padding: 18px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .btn-recommend:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 107, 107, 0.4);
        }

        .btn-recommend:active {
            transform: translateY(0);
        }

        .btn-recommend:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
            transform: none;
        }

        /* 기록 영역 */
        .history-section {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px dashed var(--border-color);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .history-title {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-primary);
        }

        .btn-clear {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--selector-bg);
            padding: 12px 18px;
            border-radius: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .history-menu {
            font-weight: 700;
            color: var(--primary-color);
        }

        .history-tag {
            font-size: 10px;
            background: var(--accent-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
        }

        .history-time {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .no-history {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 20px;
        }

        /* 스크롤바 */
        .history-list::-webkit-scrollbar { width: 5px; }
        .history-list::-webkit-scrollbar-track { background: transparent; }
        .history-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 26px; }
            .slot-content { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <button id="themeToggle" class="btn-theme-toggle" onclick="toggleTheme()">🌙</button>
        <h1>오늘 뭐 먹지?</h1>
        <p class="subtitle">결정 장애 탈출! 오늘 당신의 운명 메뉴는?</p>

        <div class="category-container" id="categoryContainer">
            <button class="btn-category active" data-category="전체">전체</button>
            <button class="btn-category" data-category="한식">한식</button>
            <button class="btn-category" data-category="일식">일식</button>
            <button class="btn-category" data-category="중식">중식</button>
            <button class="btn-category" data-category="양식">양식</button>
            <button class="btn-category" data-category="분식">분식</button>
            <button class="btn-category" data-category="디저트">디저트</button>
        </div>

        <div class="slot-machine">
            <span class="slot-label">Menu Slot</span>
            <div class="slot-content" id="slotContent">Ready?</div>
        </div>

        <button class="btn-recommend" id="btnRecommend" onclick="startRecommendation()">추천해줘!</button>

        <div class="history-section">
            <div class="history-header">
                <span class="history-title">최근 먹은 기록</span>
                <button class="btn-clear" onclick="clearHistory()">지우기</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="no-history">아직 기록이 없어요.</div>
            </div>
        </div>
    </div>

    <script>
        const menuData = [
            { name: "김치찌개", category: "한식" }, { name: "된장찌개", category: "한식" },
            { name: "불고기", category: "한식" }, { name: "비빔밥", category: "한식" },
            { name: "제육볶음", category: "한식" }, { name: "삼겹살", category: "한식" },
            { name: "초밥", category: "일식" }, { name: "라멘", category: "일식" },
            { name: "돈가스", category: "일식" }, { name: "규동", category: "일식" },
            { name: "우동", category: "일식" }, { name: "소바", category: "일식" },
            { name: "짜장면", category: "중식" }, { name: "짬뽕", category: "중식" },
            { name: "탕수육", category: "중식" }, { name: "마라탕", category: "중식" },
            { name: "볶음밥", category: "중식" }, { name: "딤섬", category: "중식" },
            { name: "파스타", category: "양식" }, { name: "피자", category: "양식" },
            { name: "스테이크", category: "양식" }, { name: "햄버거", category: "양식" },
            { name: "리조또", category: "양식" }, { name: "샌드위치", category: "양식" },
            { name: "떡볶이", category: "분식" }, { name: "김밥", category: "분식" },
            { name: "라면", category: "분식" }, { name: "순대", category: "분식" },
            { name: "튀김", category: "분식" }, { name: "쫄면", category: "분식" },
            { name: "조각케이크", category: "디저트" }, { name: "와플", category: "디저트" },
            { name: "마카롱", category: "디저트" }, { name: "빙수", category: "디저트" },
            { name: "크로플", category: "디저트" }, { name: "도넛", category: "디저트" }
        ];

        let currentCategory = "전체";
        const HISTORY_KEY = 'food_history';

        // Sound Engine
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'tick') {
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'win') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        };

        const loadHistory = () => {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            if (history.length === 0) {
                list.innerHTML = '<div class="no-history">아직 기록이 없어요.</div>';
                return;
            }
            list.innerHTML = history.map(item => `
                <div class="history-item">
                    <div>
                        <span class="history-tag">${item.category}</span>
                        <span class="history-menu">${item.name}</span>
                    </div>
                    <span class="history-time">${item.time}</span>
                </div>
            `).join('');
        };

        const saveHistory = (menu) => {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            const now = new Date();
            const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            history.unshift({ ...menu, time });
            if (history.length > 10) history.pop();
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            loadHistory();
        };

        const clearHistory = () => {
            localStorage.removeItem(HISTORY_KEY);
            loadHistory();
        };

        const startRecommendation = () => {
            const btn = document.getElementById('btnRecommend');
            const slot = document.getElementById('slotContent');
            const filtered = currentCategory === "전체" ? menuData : menuData.filter(m => m.category === currentCategory);
            
            btn.disabled = true;
            let count = 0;
            const maxTicks = 20;
            const interval = setInterval(() => {
                const randomMenu = filtered[Math.floor(Math.random() * filtered.length)];
                slot.innerText = randomMenu.name;
                playSound('tick');
                count++;

                if (count >= maxTicks) {
                    clearInterval(interval);
                    const finalMenu = filtered[Math.floor(Math.random() * filtered.length)];
                    slot.innerText = finalMenu.name;
                    slot.style.transform = 'scale(1.2)';
                    setTimeout(() => slot.style.transform = 'scale(1)', 200);
                    playSound('win');
                    saveHistory(finalMenu);
                    btn.disabled = false;
                }
            }, 100);
        };

        const toggleTheme = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            document.getElementById('themeToggle').innerText = target === 'dark' ? '☀️' : '🌙';
        };

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
            loadHistory();

            document.querySelectorAll('.btn-category').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.btn-category').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.dataset.category;
                };
            });
        };
    </script>
</body>
</html>
