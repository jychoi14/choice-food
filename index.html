<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 먹지? | What Should I Eat Today?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', savedTheme);
            const savedLang = localStorage.getItem('lang') || (navigator.language.startsWith('ko') ? 'ko' : 'en');
            document.documentElement.setAttribute('data-lang', savedLang);
        })();
    </script>
    <style>
        :root {
            --bg-color: #fffaf5;
            --card-bg: #ffffff;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --primary-color: #ff6b6b;
            --primary-hover: #ee5253;
            --accent-color: #ff9f43;
            --border-color: #ffeaa7;
            --selector-bg: #fff5e6;
            --select-btn-bg: #ffffff;
            --slot-bg: #2d3436;
            --slot-text: #fab1a0;
        }

        html[data-theme="dark"] {
            --bg-color: #1e272e;
            --card-bg: #2f3640;
            --text-primary: #f5f6fa;
            --text-secondary: #dcdde1;
            --border-color: #576574;
            --selector-bg: #1e272e;
            --select-btn-bg: #2f3640;
            --slot-bg: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.1);
            padding: 40px 24px;
            text-align: center;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .top-controls {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .btn-control {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-control:hover {
            background-color: var(--selector-bg);
            transform: scale(1.1);
        }

        h1 {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        /* 이미지 컨테이너 */
        .image-container {
            width: 100%;
            height: 200px;
            border-radius: 20px;
            margin-bottom: 20px;
            overflow: hidden;
            background: var(--selector-bg);
            border: 2px solid var(--border-color);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #foodImage {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease;
            opacity: 0;
        }

        #foodImage.show {
            opacity: 1;
        }

        .image-placeholder {
            position: absolute;
            font-size: 48px;
            opacity: 0.5;
        }

        /* 슬롯머신 스타일 */
        .slot-machine {
            background: var(--slot-bg);
            height: 80px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            border: 3px solid var(--accent-color);
        }

        .slot-content {
            font-size: 28px;
            font-weight: 900;
            color: var(--slot-text);
            text-shadow: 0 0 10px rgba(250, 177, 160, 0.5);
            transition: transform 0.1s ease-in-out;
        }

        /* 카테고리 선택 */
        .category-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .btn-category {
            background: var(--select-btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-category:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-category.active {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
        }

        /* 메인 버튼 */
        .btn-recommend {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: #ffffff;
            border: none;
            padding: 18px;
            font-size: 20px;
            font-weight: 900;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .btn-recommend:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 107, 107, 0.4);
        }

        .btn-recommend:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
        }

        /* 기록 영역 */
        .history-section {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 2px dashed var(--border-color);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .history-title {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-primary);
        }

        .btn-clear {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--selector-bg);
            padding: 12px 18px;
            border-radius: 15px;
        }

        .history-menu { font-weight: 700; color: var(--primary-color); }
        .history-tag {
            font-size: 10px;
            background: var(--accent-color);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
        }
        .history-time { font-size: 11px; color: var(--text-secondary); }
        .no-history { color: var(--text-secondary); font-size: 14px; padding: 20px; }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 26px; }
            .slot-content { font-size: 24px; }
            .image-container { height: 160px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-controls">
            <button id="langToggle" class="btn-control" onclick="toggleLang()" aria-label="언어 전환">🌐</button>
            <button id="themeToggle" class="btn-control" onclick="toggleTheme()" aria-label="테마 전환">🌙</button>
        </div>
        <h1 id="title">오늘 뭐 먹지?</h1>
        <p class="subtitle" id="subtitle">결정 장애 탈출! 오늘 당신의 운명 메뉴는?</p>

        <div class="image-container">
            <div class="image-placeholder">🍽️</div>
            <img id="foodImage" src="" alt="Food Image">
        </div>

        <div class="category-container" id="categoryContainer">
            <!-- Categories will be injected -->
        </div>

        <div class="slot-machine">
            <div class="slot-content" id="slotContent">Ready?</div>
        </div>

        <button class="btn-recommend" id="btnRecommend" onclick="startRecommendation()">추천해줘!</button>

        <div class="history-section">
            <div class="history-header">
                <span class="history-title" id="historyTitle">최근 먹은 기록</span>
                <button class="btn-clear" id="btnClear" onclick="clearHistory()">지우기</button>
            </div>
            <div class="history-list" id="historyList">
                <div class="no-history" id="noHistory">아직 기록이 없어요.</div>
            </div>
        </div>
    </div>

    <script>
        const i18n = {
            ko: {
                title: "오늘 뭐 먹지?",
                subtitle: "결정 장애 탈출! 오늘 당신의 운명 메뉴는?",
                recommend: "추천해줘!",
                historyTitle: "최근 먹은 기록",
                clear: "지우기",
                noHistory: "아직 기록이 없어요.",
                ready: "준비됐나요?",
                categories: {
                    all: "전체",
                    korean: "한식",
                    japanese: "일식",
                    chinese: "중식",
                    western: "양식",
                    snack: "분식",
                    dessert: "디저트"
                }
            },
            en: {
                title: "What to Eat?",
                subtitle: "No more worries! What's your destiny meal today?",
                recommend: "Recommend Me!",
                historyTitle: "Recent History",
                clear: "Clear",
                noHistory: "No history yet.",
                ready: "Ready?",
                categories: {
                    all: "All",
                    korean: "Korean",
                    japanese: "Japanese",
                    chinese: "Chinese",
                    western: "Western",
                    snack: "Snack",
                    dessert: "Dessert"
                }
            }
        };

        const menuData = [
            { nameEn: "Kimchi Stew", nameKo: "김치찌개", category: "korean", keyword: "kimchi-jjigae" },
            { nameEn: "Soybean Paste Stew", nameKo: "된장찌개", category: "korean", keyword: "soybean-paste-stew" },
            { nameEn: "Bulgogi", nameKo: "불고기", category: "korean", keyword: "bulgogi" },
            { nameEn: "Bibimbap", nameKo: "비빔밥", category: "korean", keyword: "bibimbap" },
            { nameEn: "Sushi", nameKo: "초밥", category: "japanese", keyword: "sushi" },
            { nameEn: "Ramen", nameKo: "라멘", category: "japanese", keyword: "ramen" },
            { nameEn: "Tonkatsu", nameKo: "돈가스", category: "japanese", keyword: "tonkatsu" },
            { nameEn: "Tteokbokki", nameKo: "떡볶이", category: "snack", keyword: "tteokbokki" },
            { nameEn: "Kimbap", nameKo: "김밥", category: "snack", keyword: "kimbap" },
            { nameEn: "Jajangmyeon", nameKo: "짜장면", category: "chinese", keyword: "jajangmyeon" },
            { nameEn: "Jjamppong", nameKo: "짬뽕", category: "chinese", keyword: "jjamppong" },
            { nameEn: "Pasta", nameKo: "파스타", category: "western", keyword: "pasta" },
            { nameEn: "Pizza", nameKo: "피자", category: "western", keyword: "pizza" },
            { nameEn: "Steak", nameKo: "스테이크", category: "western", keyword: "steak" },
            { nameEn: "Burger", nameKo: "햄버거", category: "western", keyword: "burger" },
            { nameEn: "Waffle", nameKo: "와플", category: "dessert", keyword: "waffle" },
            { nameEn: "Cake", nameKo: "조각케이크", category: "dessert", keyword: "cake" }
        ];

        let currentLang = localStorage.getItem('lang') || (navigator.language.startsWith('ko') ? 'ko' : 'en');
        let currentCategory = "all";
        const HISTORY_KEY = 'food_history_v3';

        const updateUI = () => {
            const text = i18n[currentLang];
            document.getElementById('title').innerText = text.title;
            document.getElementById('subtitle').innerText = text.subtitle;
            document.getElementById('btnRecommend').innerText = text.recommend;
            document.getElementById('historyTitle').innerText = text.historyTitle;
            document.getElementById('btnClear').innerText = text.clear;
            document.getElementById('slotContent').innerText = text.ready;
            
            const catContainer = document.getElementById('categoryContainer');
            catContainer.innerHTML = '';
            Object.keys(text.categories).forEach(key => {
                const btn = document.createElement('button');
                btn.className = `btn-category ${currentCategory === key ? 'active' : ''}`;
                btn.innerText = text.categories[key];
                btn.onclick = () => {
                    currentCategory = key;
                    updateUI();
                };
                catContainer.appendChild(btn);
            });
            loadHistory();
        };

        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                if (type === 'tick') {
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start(); osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'win') {
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch (e) {}
        };

        const loadHistory = () => {
            const list = document.getElementById('historyList');
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            if (history.length === 0) {
                list.innerHTML = `<div class="no-history">${i18n[currentLang].noHistory}</div>`;
                return;
            }
            list.innerHTML = history.map(item => `
                <div class="history-item">
                    <div>
                        <span class="history-tag">${i18n[currentLang].categories[item.category]}</span>
                        <span class="history-menu">${currentLang === 'ko' ? item.nameKo : item.nameEn}</span>
                    </div>
                    <span class="history-time">${item.time}</span>
                </div>
            `).join('');
        };

        const saveHistory = (menu) => {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            const now = new Date();
            const time = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
            history.unshift({ ...menu, time });
            if (history.length > 10) history.pop();
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            loadHistory();
        };

        const clearHistory = () => {
            localStorage.removeItem(HISTORY_KEY);
            loadHistory();
        };

        const startRecommendation = () => {
            const btn = document.getElementById('btnRecommend');
            const slot = document.getElementById('slotContent');
            const img = document.getElementById('foodImage');
            const filtered = currentCategory === "all" ? menuData : menuData.filter(m => m.category === currentCategory);
            
            btn.disabled = true;
            img.classList.remove('show');
            
            let count = 0;
            const maxTicks = 15;
            const interval = setInterval(() => {
                const randomMenu = filtered[Math.floor(Math.random() * filtered.length)];
                slot.innerText = currentLang === 'ko' ? randomMenu.nameKo : randomMenu.nameEn;
                playSound('tick');
                count++;
                if (count >= maxTicks) {
                    clearInterval(interval);
                    const finalMenu = filtered[Math.floor(Math.random() * filtered.length)];
                    slot.innerText = currentLang === 'ko' ? finalMenu.nameKo : finalMenu.nameEn;
                    slot.style.transform = 'scale(1.2)';
                    
                    // Update Image
                    const imgUrl = `https://source.unsplash.com/800x600/?${finalMenu.keyword},food`;
                    img.src = imgUrl;
                    img.onload = () => img.classList.add('show');
                    
                    setTimeout(() => slot.style.transform = 'scale(1)', 200);
                    playSound('win');
                    saveHistory(finalMenu);
                    btn.disabled = false;
                }
            }, 120);
        };

        const toggleLang = () => {
            currentLang = currentLang === 'ko' ? 'en' : 'ko';
            localStorage.setItem('lang', currentLang);
            document.documentElement.setAttribute('data-lang', currentLang);
            updateUI();
        };

        const toggleTheme = () => {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            document.getElementById('themeToggle').innerText = target === 'dark' ? '☀️' : '🌙';
        };

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.getElementById('themeToggle').innerText = savedTheme === 'dark' ? '☀️' : '🌙';
            updateUI();
        };
    </script>
</body>
</html>
